name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # postinstall downloads Electron and prepares node-pty (scripts/postinstall.mjs).
      - run: npm ci
      - run: npm run typecheck
      # tools/lint has its own dependencies; the script installs them on first use.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Boots the built app under a virtual display and walks every screen (scripts/smoke.mjs). Not yet
  # proven on the runner (the sandbox, and safeStorage without a keyring, may differ), so it does
  # not block a pull request until it has run green a few times.
  smoke:
    name: smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm run smoke
        env:
          WORKHUB_SMOKE_NO_SANDBOX: '1'
