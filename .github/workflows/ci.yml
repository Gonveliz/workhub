name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # postinstall downloads Electron and prepares node-pty (scripts/postinstall.mjs).
      - run: npm ci
      - run: npm run typecheck
      # tools/lint has its own dependencies; the script installs them on first use.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Boots the built app under a virtual display and walks every screen (scripts/smoke.mjs). Not yet
  # proven on the runner (the sandbox, and safeStorage without a keyring, may differ), so it does
  # not block a pull request until it has run green a few times.
  smoke:
    name: smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # xvfb's default screen is 640x480; the script also sizes the window itself.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run smoke
        env:
          WORKHUB_SMOKE_NO_SANDBOX: '1'

  # A real run of the tools Workhub installs for itself (packages/adapters/src/managed-tools): the
  # private Node.js downloaded and checked, OpenCode installed with it into a temporary folder, both
  # run from there. Windows is the system nobody here can try by hand. It downloads from nodejs.org
  # and the npm registry, so it does not block a pull request.
  managed-tools:
    name: managed tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every step prints a "[managed-tools]" line: phase, versions, and npm's output on a failure.
      - run: npx vitest run --project adapters --reporter=verbose --silent=false test/managed-tools.smoke.test.ts
        env:
          WORKHUB_MANAGED_TOOLS_SMOKE: '1'
